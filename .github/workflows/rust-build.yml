name: Phase 5 Rust & WASM Compiler

on:
  push:
    paths:
      - 'server/**'
      - 'dsp-wasm/**'
      - 'Cargo.toml'
  workflow_dispatch: # Allow manual triggering from GitHub UI

jobs:
  build:
    name: Build Phase 5 Architecture
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM DSP Engine
        run: |
          cd dsp-wasm
          wasm-pack build --target web --release

      - name: Build WebRTC SFU Server
        run: |
          cd server
          cargo build --release

      - name: Commit Compiled WASM back to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dsp-wasm/pkg/ -f
          git commit -m "chore: Auto-compile WASM DSP module [skip ci]" || echo "No changes to commit"
          git push

      - name: Upload Server Binary (Linux x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-sfu-server
          path: target/release/server
