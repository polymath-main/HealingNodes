<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HealingNodes - Phase 5</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Phase 5 WebGL Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Phase 4 FAB Navigation -->
    <div id="fab-container">
        <button id="fab-main">⚙</button>
        <div id="fab-menu" class="hidden">
            <button id="btn-host">Host Master</button>
            <button id="btn-join">Join Receiver</button>
            <button id="btn-mode">Modes (Presets)</button>
            <button id="btn-config">Node Config</button>
        </div>
    </div>

    <!-- WebRTC Autoplay Bypass Fallback -->
    <div id="autoplay-overlay" class="hidden">
        <h1>Tap to Unmute Stream</h1>
    </div>

    <!-- WebRTC Audio Element (Strategy B Hybrid) -->
    <audio id="webrtc-audio" autoplay playsinline></audio>

    <script type="module" src="js/app.js"></script>



    <!-- Phase 4 Mode Presets Overlay -->
    <div id="mode-overlay" class="hidden">
        <div class="glass-panel">
            <h2>Select Mode Preset</h2>
            <button class="mode-select" data-freq="396">396 Hz - Liberation</button>
            <button class="mode-select" data-freq="432">432 Hz - Healing</button>
            <button class="mode-select" data-freq="528">528 Hz - DNA Repair</button>
            <button id="close-mode" style="margin-top: 20px; background: rgba(255,50,50,0.4);">Close</button>
        </div>
    </div>


</body>
</html>
