<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealingNodes Phase 7 Client</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #1a1a1a;
        color: #f0f0f0;
        text-align: center;
      }
      h1 { color: #4CAF50; }
      p { font-size: 1.2rem; }
    </style>
</head>
<body>
    <h1>HealingNodes Media Receiver</h1>
    <p>Enter the IP address shown on your Desktop App (e.g., 192.168.1.100)</p>
    <input type="text" id="ip-input" placeholder="192.168.1.100" style="padding: 10px; font-size: 1.2rem; margin-bottom: 15px;" />
    <br/>
    <button id="connect-btn" style="padding: 10px 20px; font-size: 1.2rem; cursor: pointer; background: #4CAF50; border: none; color: white; border-radius: 5px;">Connect</button>
    <p id="status-text" style="color: #888; font-size: 1rem;">Waiting to connect...</p>
    <script type="module" src="src/index.js"></script>
</body>
</html>
