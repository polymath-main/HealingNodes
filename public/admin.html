<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealingNodes - Dual-Core Admin</title>
    <style>
        body { margin: 0; padding: 20px; background-color: #1a1a2e; color: #e2e2e2; font-family: 'Courier New', Courier, monospace; }
        h1 { border-bottom: 1px solid #333; padding-bottom: 10px; }
        .panel { background-color: #16213e; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .stat-value { font-size: 1.5em; color: #43e8d8; font-weight: bold; }
        .flex-row { display: flex; gap: 20px; flex-wrap: wrap; }
        .box { flex: 1; min-width: 200px; background: #0f172a; padding: 15px; border-radius: 6px; }
        button { background-color: #0f3460; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-family: inherit; margin: 5px; transition: 0.3s; }
        button:hover { background-color: #e94560; }
        input[type="range"], input[type="file"] { width: 100%; margin-top: 10px; }
        
        .core-btn { width: 48%; font-size: 1.2em; padding: 15px; background: #222; }
        .core-btn.active { background: #e94560; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>System Override Console</h1>

    <div class="panel flex-row">
        <button id="btn-mode-core" class="core-btn active" onclick="switchCore('mode')">CORE 1: Mode Engine</button>
        <button id="btn-media-core" class="core-btn" onclick="switchCore('media')">CORE 2: Media Theater</button>
    </div>

    <div class="panel flex-row">
        <div class="box">
            <h2>Mesh Status</h2>
            <p>Active Nodes: <span id="admin-nodes" class="stat-value">0</span></p>
        </div>
    </div>

    <!-- CORE 1: MODE ENGINE UI -->
    <div id="panel-mode" class="panel">
        <h2>Emotional Trajectory (Mode Engine)</h2>
        <div class="box">
            <p>Current Vector: <span id="v-freq">0</span>Hz | Ratio: <span id="v-ratio">0</span></p>
        </div>
        <div>
            <label>Morph Duration: <span id="duration-val">5</span> Minutes</label>
            <input type="range" id="duration-slider" min="1" max="60" value="5">
        </div>
        <div class="flex-row" style="margin-top:20px;">
            <div class="box">
                <button onclick="triggerTrajectory('sadness')">Catharsis (Minor 3rd)</button>
                <button onclick="triggerTrajectory('focused')">Flow State (Golden Ratio)</button>
                <button onclick="triggerTrajectory('energetic')">Energetic (Perfect 5th)</button>
            </div>
            <div class="box">
                <button onclick="triggerTrajectory('thinking')">Deep Thinking</button>
                <button onclick="triggerTrajectory('hybrid')" style="background-color: #7928ca;">Transcendental Hybrid</button>
                <button onclick="fetch('/api/trajectory/stop', {method:'POST'})" style="background-color: #555;">HALT Trajectory</button>
            </div>
        </div>
    </div>

    <!-- CORE 2: MEDIA ENGINE UI -->
    <div id="panel-media" class="panel hidden">
        <h2>Spatial Media Theater</h2>
        
        <div class="flex-row">
            <div class="box">
                <h3>1A. Upload Local Media</h3>
                <form id="upload-form">
                    <input type="file" id="media-file" accept="audio/mp3, audio/wav">
                    <button type="submit" style="margin-top:10px;">Upload & Sync</button>
                </form>
            </div>
            <div class="box">
                <h3>1B. Stream YouTube</h3>
                <form id="youtube-form">
                    <input type="text" id="youtube-url" placeholder="https://youtube.com/watch?v=..." style="width: 100%; padding: 8px; margin-top: 10px;">
                    <button type="submit" style="margin-top:10px; background-color: #ff0000;">Sync YouTube Stream</button>
                </form>
            </div>
        </div>

        <div class="box" style="margin-top: 20px; text-align: center;">
            <p id="media-status" class="stat-value">Awaiting Media Input...</p>
            <h3>2. Mesh Playback Sync</h3>
            <button onclick="fetch('/api/media/play', {method:'POST'})" style="background: #28a745; font-size: 1.2em;">▶ PLAY (Global Sync)</button>
            <button onclick="fetch('/api/media/pause', {method:'POST'})" style="background: #dc3545; font-size: 1.2em;">⏸ PAUSE</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        const PRESETS = {
            'sadness': { f_base: 30, T_breath: 12, alpha_noise: 2.0, phi_color: 240, harmonic_ratio: 1.2, orbital_velocity: 0, binaural_offset: 0 },
            'focused': { f_base: 40, T_breath: 8, alpha_noise: 1.0, phi_color: 120, harmonic_ratio: 1.618, orbital_velocity: 0, binaural_offset: 0 },
            'energetic': { f_base: 55, T_breath: 4, alpha_noise: 0.5, phi_color: 0, harmonic_ratio: 1.5, orbital_velocity: 0, binaural_offset: 0 },
            'thinking': { f_base: 33, T_breath: 15, alpha_noise: 2.5, phi_color: 280, harmonic_ratio: 1.333, orbital_velocity: 0, binaural_offset: 0 },
            'hybrid': { f_base: 108, T_breath: 6.18, alpha_noise: 1.5, phi_color: 360, harmonic_ratio: 1.618, orbital_velocity: 0.05, binaural_offset: 4 }
        };

        socket.on('connect', () => socket.emit('register', 'admin'));

        // FIX: Listen to core_switch explicitly to update UI
        socket.on('core_switch', (data) => {
            updateCoreUI(data.activeCore);
        });

        socket.on('admin_state_update', (data) => {
            document.getElementById('admin-nodes').innerText = data.nodeCount;
            if(data.activeCore) updateCoreUI(data.activeCore);
            
            if(data.activeCore === 'mode' && data.state) {
                document.getElementById('v-freq').innerText = data.state.f_base.toFixed(2);
                document.getElementById('v-ratio').innerText = data.state.harmonic_ratio.toFixed(3);
            }
            if(data.activeCore === 'media' && data.mediaState) {
                if(data.mediaState.url) {
                    document.getElementById('media-status').innerText = "Media Ready & Buffered Across Mesh";
                }
            }
        });

        document.getElementById('duration-slider').addEventListener('input', (e) => {
            document.getElementById('duration-val').innerText = e.target.value;
        });

        function switchCore(coreName) {
            fetch('/api/core/switch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ core: coreName })
            });
        }

        function updateCoreUI(coreName) {
            if (coreName === 'mode') {
                document.getElementById('btn-mode-core').classList.add('active');
                document.getElementById('btn-media-core').classList.remove('active');
                document.getElementById('panel-mode').classList.remove('hidden');
                document.getElementById('panel-media').classList.add('hidden');
            } else {
                document.getElementById('btn-media-core').classList.add('active');
                document.getElementById('btn-mode-core').classList.remove('active');
                document.getElementById('panel-media').classList.remove('hidden');
                document.getElementById('panel-mode').classList.add('hidden');
            }
        }

        function triggerTrajectory(presetKey) {
            const mins = document.getElementById('duration-slider').value;
            const target = PRESETS[presetKey];
            fetch('/api/trajectory/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ targetState: target, durationMs: mins * 60000 })
            });
        }

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('media-file').files[0];
            if(!file) return alert("Select a file first.");
            
            const formData = new FormData();
            formData.append('track', file);
            
            document.getElementById('media-status').innerText = "Uploading to Server...";
            const res = await fetch('/api/media/upload', { method: 'POST', body: formData });
            if (res.ok) document.getElementById('media-status').innerText = "Upload Complete. Mesh is syncing buffer...";
        });

        document.getElementById('youtube-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('youtube-url').value;
            if(!url) return alert("Enter YouTube URL");

            document.getElementById('media-status').innerText = "Resolving YouTube Stream...";
            const res = await fetch('/api/media/youtube', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });
            if (res.ok) document.getElementById('media-status').innerText = "Stream Resolved. Mesh is syncing buffer...";
        });
    </script>
</body>
</html>
