<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HealingNodes - Spatial Mesh</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #eeeeee;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* The Daydream Canvas */
        #visual-engine {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        /* UI Overlay */
        #ui-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            transition: opacity 2s ease-in-out;
        }
        #ui-container.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        h1 { margin-bottom: 10px; font-weight: normal; letter-spacing: 4px; color: #fff; }
        .status { margin-bottom: 30px; font-size: 0.9em; color: #aaa; letter-spacing: 1px; }
        
        #start-btn {
            background-color: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 15px 40px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.5s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #start-btn:hover { background-color: rgba(255,255,255,0.1); border-color: #fff; }
    </style>
</head>
<body>
    <canvas id="visual-engine"></canvas>

    <div id="ui-container">
        <h1>HealingNodes</h1>
        <div class="status" id="status-text">Connecting to Mesh...</div>
        <button id="start-btn">Enter Daydream</button>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
